name: Deploy para Hostinger

on:
  push:
    branches:
      - main  # Você pode ajustar para a branch desejada

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Configuração FTP
      uses: SamKirkland/FTP-Deploy-Action@5.1.0
      with:
        ftp-server: ${{ secrets.FTP_SERVER }}
        ftp-username: ${{ secrets.FTP_USERNAME }}
        ftp-password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./  # Diretório local do código
        server-dir: ${{ secrets.FTP_DIRECTORY }}
